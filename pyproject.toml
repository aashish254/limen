[build-system]
# PEP 639 (string `license` + `license-files`) requires setuptools >= 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "subproto"
# One source of truth for the number: `subproto.__version__`, which `subproto
# --version` also prints. Setuptools reads the assignment statically at build time.
dynamic = ["version"]
description = "A System One layer for coding agents: decide before you pay."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 form, accepted by the setuptools the build isolated-env installs
# (verified below with `python3 -m build`; requires setuptools >= 77).
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "proxy", "coding-agents", "cost", "latency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    # No `License ::` trove: setuptools >= 77 rejects license classifiers when the
    # PEP 639 `license` expression is present (verified with `python3 -m build`).
    # POSIX only: the test suite has green runs on macOS and Linux. Do not
    # claim Windows until CI proves it.
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    # Add further `:: 3.x` troves here as CI runs them green.
    # Every trove below must exist on https://pypi.org/classifiers/ — PyPI rejects the
    # whole upload for one invented string (a 400 that names it). This used to carry an
    # invented `:: Debug Tools`; `Proxy Servers` is the valid trove for what this is.
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

# PyPI renders the long description from README.md; the reference docs live with the code.
[project.urls]
Homepage = "https://github.com/aashish254/limen"
Repository = "https://github.com/aashish254/limen"
Issues = "https://github.com/aashish254/limen/issues"
# `Documentation` used to resolve to `limen#readme`, i.e. to the very page these URLs
# appear on. It now names the reference docs, and the Pages site gets its own key so a
# reader on pypi.org can reach the printout rather than only the source.
Documentation = "https://github.com/aashish254/limen/blob/main/docs/index.md"
"Live measurement page" = "https://aashish254.github.io/limen/"

[project.optional-dependencies]
dev = ["pytest"]
# Verified against the PyPI JSON API (pypi.org/pypi/laya/json): the Laya serving
# distribution is named `laya`, exposes a `serve` extra, and declares
# requires_python >= 3.10. The marker keeps `pip install subproto[laya]`
# installable-without-error semantics on 3.9 honest (extra resolves to nothing).
laya = ["laya[serve]; python_version >= '3.10'"]

[project.scripts]
subproto = "subproto.cli:main"

[tool.setuptools]
# Explicit package list, so subproto/tests/ is never an importable package in the
# wheel. It still reaches contributors through the sdist via MANIFEST.in.
packages = ["subproto", "subproto.systemone", "fakeup"]
include-package-data = false

# The one non-.py file an installed package reads at run time: the Router ranks the
# adapters against measured evidence, and a wheel without it leaves `SUBPROTO_ROUTER=on`
# answering "no measured evidence" on the install route the README leads with (S46/M4).
[tool.setuptools.package-data]
"subproto.systemone" = ["evidence/*.json"]

[tool.setuptools.dynamic]
version = {attr = "subproto.__version__"}

[tool.pytest.ini_options]
# `pytest` with no arguments means the suite, not whatever test_-named file a
# contributor left in bench/ or train/ — and the benches are not collectable
# (they take locks and rewrite sources), so collecting them would be a false failure.
testpaths = ["subproto/tests"]
