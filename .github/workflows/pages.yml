name: pages

# The landing page is a build artifact of the measurement run, so it is committed and
# published as-is: `bench/launch_stats.py` measures, `tools/make_site.py` renders, and
# this workflow only carries `_site/` to Pages. Nothing recomputes a number here, so the
# page a reviewer reads on github.io is byte-identical to the one in the repo.

on:
  push:
    branches: [main]
    paths: ["_site/**", "docs/assets/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish a page with an unrendered token
        run: |
          if grep -rl '{{[A-Z_]*}}' _site >/dev/null 2>&1; then
            grep -rn '{{[A-Z_]*}}' _site
            exit 1
          fi
          test -s _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
