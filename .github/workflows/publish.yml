name: publish

# The release is built and uploaded from the tag, by CI, with no credential stored on
# anybody's laptop: PyPI trusts this workflow's OIDC identity, registered once as a
# "pending publisher" on pypi.org. Nothing here recomputes a number — `verify` is the
# gate on the code, and this job only packages the tagged tree, proves the artifact
# installs and runs, and hands it to the index.
#
# Status, so the next reader does not assume more than is true: every step below except the
# upload has been run locally against a clean clone of the tree, and the first release this
# workflow publishes will be the one after 0.1.0 — which went out by hand with a short-lived
# API token on 2026-09-28, before any publisher was registered.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Which tag to publish, e.g. v0.1.1
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every classifier must be one PyPI recognises
        run: |
          set -euo pipefail
          python - <<'PYP'
          import re, html, tomllib, urllib.request
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["classifiers"]
          page = urllib.request.urlopen("https://pypi.org/classifiers/").read().decode()
          valid = {html.unescape(re.sub(r"<[^>]+>", "", m.group(1))).strip()
                   for m in re.finditer(r'data-clipboard-target="source">(.*?)</a>', page, re.S)}
          assert len(valid) > 500, "the classifier list did not parse (%d)" % len(valid)
          bad = [c for c in declared if c not in valid]
          for c in declared:
              print("%s %s" % ("ok  " if c not in bad else "BAD ", c))
          # One invented trove 400s the whole upload, after the files are already sent.
          assert not bad, "not on https://pypi.org/classifiers/: %s" % bad
          PYP
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --quiet build twine
          python -m build
          twine check dist/*
      - name: The artifact must carry the version the tag was cut from
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${REF#v}"
          SRC="$(python -c 'import subproto; print(subproto.__version__)')"
          WHEEL="$(basename dist/*.whl)"
          echo "tag=$TAG source=$SRC wheel=$WHEEL"
          test "$SRC" = "$TAG" || { echo "subproto.__version__ disagrees with the tag"; exit 1; }
          test "$WHEEL" = "subproto-$TAG-py3-none-any.whl" \
            || { echo "the built wheel is not tagged $TAG"; exit 1; }
      - name: Install the built wheel offline and run it
        run: |
          set -euo pipefail
          SMOKE="$PWD/.smoke"
          python -m venv "$SMOKE"
          "$SMOKE/bin/python" -m pip install --quiet --no-index --find-links "$PWD/dist" subproto
          "$SMOKE/bin/python" -m pip check
          # The point of the next cd is that nothing here can reach the source tree: a
          # wheel that only works from inside the clone is not a release. So every path
          # the smoke uses after it has to be absolute — a relative `.smoke/bin/subproto`
          # resolved against the clone, printed "No such file or directory" in an empty
          # temp dir, and cost the first trusted-publishing run (2026-09-28).
          cd "$(mktemp -d)"
          SUBPROTO_HOME="$PWD" "$SMOKE/bin/subproto" --version
          SUBPROTO_HOME="$PWD" "$SMOKE/bin/subproto" doctor --port 0 > /dev/null
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
