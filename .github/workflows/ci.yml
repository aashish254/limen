name: verify

# Three jobs, answering three different questions:
#   suite    — do the tests pass on someone else's OS, on both supported Pythons?
#   gates    — does the whole one-command gate (benches, demo, mutation gate) hold?
#   install  — can a stranger `pip install` this and run the command, from a
#              directory that is *not* the clone? Nothing in the runtime may
#              depend on repo files, so this job unpacks the wheel elsewhere.
#
# No API key, no spend, no model weights: the Laya legs skip themselves unless
# SUBPROTO_LAYA_PYTHON names an interpreter that can import `laya`, and `fakeup`
# stands in for every provider.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: pytest ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
        os: [ubuntu-latest, macos-latest]
        include:
          # Windows runs, but is not a release gate: `os.getloadavg` is POSIX and
          # ANSI escape handling differs. It is reported rather than hidden, so a
          # Windows contributor sees the real state of their platform here.
          - os: windows-latest
            python: "3.11"
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: false
      - name: Install pytest (the package itself has zero dependencies)
        run: python -m pip install --quiet "pytest>=7"
      - name: Byte-compile every package under -W error
        run: >-
          python -W error -m compileall -q subproto fakeup bench train
      - name: pytest
        run: python -m pytest -q

  gates:
    name: one-command gate (benches + demo + mutation gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev requirements
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: bash run_tests.sh
        run: bash run_tests.sh
        env:
          PYTHON: python3.11

  install:
    name: pip install and run (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Install the wheel into a clean venv, offline
        run: |
          python -m venv .verify-venv
          .verify-venv/bin/python -m pip install --quiet --no-index --find-links dist subproto
          .verify-venv/bin/python -m pip check
      - name: The installed package agrees about which build it is
        run: |
          .verify-venv/bin/python - <<'PYV'
          import importlib.metadata as md
          import subproto
          assert md.version("subproto") == subproto.__version__, (
              md.version("subproto"), subproto.__version__)
          print("metadata and subproto.__version__ agree:", subproto.__version__)
          PYV
          .verify-venv/bin/subproto --version
      - name: Run the installed command from outside the clone
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          WORK="$(mktemp -d)"
          BIN="$ROOT/.verify-venv/bin/subproto"
          cd "$WORK"
          SUBPROTO_HOME="$WORK/home" "$BIN" --help > /dev/null
          SUBPROTO_HOME="$WORK/home" "$BIN" doctor --port 0 --json > doctor.json
          SUBPROTO_HOME="$WORK/home" "$BIN" demo --port 8743 --slots > demo.log
          SUBPROTO_HOME="$WORK/home" "$BIN" report
          echo "--- doctor ---"; cat doctor.json
          echo "--- demo tail ---"; tail -5 demo.log
      - name: Confirm the sdist carries what the docs tell people to run
        run: |
          python - <<'PYSMOKE'
          import glob, tarfile
          name = glob.glob("dist/*.tar.gz")[0]
          names = set(tarfile.open(name).getnames())
          top = name.split(".tar.gz")[0]
          need = ["pyproject.toml", "run_tests.sh", "bench/ablation.py",
                  "bench/mutation_gate.py", "fakeup/server.py", "WIRING.md"]
          missing = [n for n in need if "%s/%s" % (top, n) not in names]
          assert not missing, "sdist is missing: %s" % missing
          print("sdist carries the bench and the fakeup mock")
          PYSMOKE
      - name: Run install.sh, the no-package-index route the README leads with
        run: |
          set -euo pipefail
          SUBPROTO_BIN_DIR="$PWD/.verify-bin" bash install.sh
          export SUBPROTO_HOME="$(mktemp -d)"
          ./.verify-bin/subproto doctor --port 0 --json
          ./.verify-bin/subproto demo --port 8744 --slots > /dev/null
          ./.verify-bin/subproto report | head -3
